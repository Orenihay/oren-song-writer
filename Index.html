<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oren Song Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ── Tokens ── */
:root {
  --bg:       #060a10;
  --bg-alt:   #030709;
  --surf:     #0c1520;
  --card:     #111d2d;
  --card2:    #17263d;
  --em:       #0f9387;
  --em-lt:    #16c8bb;
  --em-glow:  rgba(22,200,187,.25);
  --em-dim:   rgba(22,200,187,.09);
  --chord:    #22c55e;
  --chord-bg: rgba(34,197,94,.12);
  --text:     #e7f8f6;
  --t2:       #5ca09a;
  --t3:       #163a37;
  --bdr:      #1c3647;
  --bdr2:     #0f2232;
  --pin:      #f59e0b;
  --violet:   #c084fc;
  --r:        15px;
  --nav-h:    68px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f0faf9; --bg-alt:#e8f7f5; --surf:#ffffff; --card:#ffffff; --card2:#f0faf9;
    --em: #0d9488; --em-lt:#0a7a6e; --em-glow:rgba(13,148,136,.14); --em-dim:rgba(13,148,136,.07);
    --chord: #16a34a; --chord-bg:rgba(22,163,74,.1);
    --text: #052b27; --t2:#237a72; --t3:#aad9d4;
    --bdr: #b3ddd8; --bdr2:#cdeae7;
  }
}
:root[data-theme="light"] {
  --bg: #f0faf9; --bg-alt:#e8f7f5; --surf:#ffffff; --card:#ffffff; --card2:#f0faf9;
  --em: #0d9488; --em-lt:#0a7a6e; --em-glow:rgba(13,148,136,.14); --em-dim:rgba(13,148,136,.07);
  --chord: #16a34a; --chord-bg:rgba(22,163,74,.1);
  --text: #052b27; --t2:#237a72; --t3:#aad9d4;
  --bdr: #b3ddd8; --bdr2:#cdeae7;
}
/* ── Reset ── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { height:100%; font-size:17px; }
body { height:100%; font-family:'Rubik','Segoe UI','Arial Hebrew',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
button, input { font-family:inherit; }

/* ── Layout ── */
#root {
  position:fixed; top:0; left:0; right:0;
  bottom:var(--nav-h);
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--bg);
}
.bot-nav {
  position:fixed; bottom:0; left:0; right:0; height:var(--nav-h);
  background:var(--surf); border-top:1px solid var(--bdr);
  display:flex; align-items:stretch; z-index:10;
  box-shadow:0 -4px 28px rgba(0,0,0,.4);
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; cursor:pointer; color:var(--t2); padding:6px 0;
  position:relative; transition:color .15s;
}
.nav-btn.on { color:var(--em-lt); }
.nav-btn.on::after {
  content:''; position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%; background:var(--em-lt);
}
.nav-btn:active { opacity:.7; }
.nav-ico { width:24px; height:24px; }
.nav-lbl { font-size:.68rem; font-weight:600; letter-spacing:.01em; }

/* ── Toast ── */
.toast {
  position:fixed; bottom:calc(var(--nav-h) + 12px); left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--card); color:var(--text); padding:11px 24px;
  border-radius:999px; font-size:.88rem; white-space:nowrap;
  transition:transform .22s ease,opacity .22s ease; opacity:0; z-index:100; pointer-events:none;
  border:1px solid var(--bdr); box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.ok   { background:rgba(34,197,94,.18); color:#22c55e; border-color:#22c55e; }
.toast.err  { background:rgba(239,68,68,.16); color:#f87171; border-color:#f87171; }

/* ── Stale banner ── */
#stale-banner { display:none; background:var(--pin); color:#78350f; padding:10px 16px; font-size:.88rem; text-align:center; position:fixed; top:0; left:0; right:0; z-index:200; }
#stale-banner.show { display:block; }

/* ── Spinner ── */
.spinner { width:36px; height:36px; border:3px solid var(--bdr); border-top-color:var(--em-lt); border-radius:50%; animation:spin .8s linear infinite; margin:16px auto; }
@keyframes spin { to { transform:rotate(360deg); } }

/* RTL lyrics input */
.lyric-input { direction:rtl; text-align:right; }

/* ── Word-level chord editing ── */
.line-pair { background:var(--card); border-radius:10px; padding:3px 6px 6px; margin-bottom:8px; border:1px solid var(--bdr2); }
.line-pair:focus-within { border-color:var(--em); box-shadow:0 0 0 3px var(--em-dim); }
.word-chips-row { display:flex; flex-wrap:wrap; gap:0 2px; padding:5px 2px 1px; min-height:28px; align-items:flex-end; cursor:default; direction:rtl; }
.word-chip { display:inline-flex; flex-direction:column; align-items:center; cursor:pointer; border-radius:6px; padding:2px 4px; transition:background .1s; }
.word-chip:hover { background:var(--em-dim); }
.word-chip:active { background:var(--em-glow); }
.word-chord-slot { min-height:22px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:1px; }
.word-lyr { font-size:.95rem; white-space:nowrap; line-height:1.45; color:var(--text); }
.chord-add-hint { font-size:.6rem; color:var(--t3); opacity:0; transition:opacity .12s; }
.word-chip:hover .chord-add-hint { opacity:1; }
.word-chip .chord { font-size:.78rem; color:var(--chord); font-weight:700; font-family:'JetBrains Mono',monospace; white-space:nowrap; background:var(--chord-bg); padding:2px 6px; border-radius:5px; }
.word-chip-ph { opacity:.45; }
.word-chip.chord-dragging { opacity:.35; }
.chord.chord-src-dragging { opacity:.2; transform:scale(.8); }
.chord-drag-ghost { position:fixed;top:-100px;left:-100px;padding:4px 12px;border-radius:9px;background:var(--chord);color:var(--bg);font-weight:700;font-size:.85rem;font-family:'JetBrains Mono',monospace;pointer-events:none;z-index:9999;white-space:nowrap; }
.word-chip.chord-drag-over .word-chord-slot { outline:2px solid var(--em); background:rgba(13,148,136,.2); border-radius:4px; }
.line-input-wrap { display:flex; align-items:center; gap:5px; padding-top:2px; }

/* Picker */
.picker-search { width:calc(100% - 24px); margin:0 12px 8px; padding:10px 14px; border-radius:12px; border:1px solid var(--bdr); background:var(--card); color:var(--text); font-size:.95rem; outline:none; }
.picker-search:focus { border-color:var(--em-lt); box-shadow:0 0 0 3px var(--em-dim); }
.picker-search::placeholder { color:var(--t3); }
.picker-common { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 10px; }
.picker-sect-lbl { width:100%; font-size:.62rem; font-weight:700; color:var(--t3); letter-spacing:.06em; text-transform:uppercase; padding:4px 0 2px; }
.sheet-text-input { width:100%; background:var(--card); border:1px solid var(--bdr); border-radius:10px; padding:12px 14px; color:var(--text); font-family:inherit; font-size:1rem; outline:none; transition:border-color .15s; caret-color:var(--em-lt); direction:rtl; }
.sheet-text-input:focus { border-color:var(--em); box-shadow:0 0 0 3px var(--em-dim); }
.sheet-text-input::placeholder { color:var(--t3); }

/* ── App header ── */
.app-hdr {
  display:flex; align-items:center; gap:12px; padding:13px 16px;
  background:var(--surf); border-bottom:1px solid var(--bdr); position:sticky; top:0; z-index:5;
}
.app-logo-inline { flex:1; display:flex; align-items:center; gap:8px; }
.ali-oren { font-size:1.1rem; font-weight:700; font-style:italic; color:var(--em-lt); letter-spacing:-.3px; }
.ali-book { font-size:1.1rem; font-weight:400; color:var(--t2); }
.hdr-icon-btn {
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; color:var(--t2); cursor:pointer;
  transition:background .12s, color .12s, transform .1s;
}
.hdr-icon-btn:hover, .hdr-icon-btn.active { background:var(--em-dim); color:var(--em-lt); }
.hdr-icon-btn:active { transform:scale(.85); }

/* ── Song nav bar ── */
.song-nav-bar {
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--surf); border-bottom:1px solid var(--bdr); position:sticky; top:0; z-index:5;
}
.nav-back {
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; color:var(--t2); cursor:pointer; transition:background .12s, color .12s;
}
.nav-back:hover { background:var(--em-dim); color:var(--em-lt); }
.top-action-grp { display:flex; gap:4px; }
.top-act-btn {
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:9px; background:var(--em-dim); color:var(--em-lt); cursor:pointer;
  transition:background .12s, transform .1s;
}
.top-act-btn:hover { background:var(--em-glow); }
.top-act-btn:active { transform:scale(.88); }
.song-hdr-info { flex:1; padding:0 6px; min-width:0; }
.song-hdr-name { font-size:.95rem; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-hdr-key  { font-size:.74rem; color:var(--t2); margin-top:1px; }

/* ── Sync row ── */
.sync-row {
  display:flex; align-items:center; gap:5px; padding:4px 16px;
  font-size:.74rem; color:var(--t3); background:var(--bg-alt); border-bottom:1px solid var(--bdr2);
}
.sync-dot { width:5px; height:5px; border-radius:50%; background:var(--t3); }
#syncStatus[data-state="pending"] { color:var(--pin); }
#syncStatus[data-state="ok"]      { color:var(--em-lt); }
#syncStatus[data-state="error"],
#syncStatus[data-state="conflict"]{ color:#f87171; }

/* ── Arrangement strip ── */
.arr-strip {
  display:flex; align-items:center; gap:8px; padding:10px 16px;
  overflow-x:auto; border-bottom:1px solid var(--bdr2); scrollbar-width:none;
}
.arr-strip::-webkit-scrollbar { display:none; }
.arr-chip {
  flex-shrink:0; padding:5px 12px; border-radius:8px; border:1px solid;
  font-size:.74rem; font-weight:600; font-family:'JetBrains Mono',monospace; white-space:nowrap;
}

/* ── Editor scroll ── */
.editor-scroll { padding:12px 12px 120px; }

/* ── Block ── */
.block { margin-bottom:12px; border:1px solid var(--bdr); border-left:3px solid transparent; border-radius:var(--r); background:var(--card); overflow:hidden; transition:opacity .12s, transform .12s; }
.block.block-dragging { opacity:.3; transform:scale(.99); pointer-events:none; }
.block.block-drag-over { border-top:3px solid var(--em); }
.block-hdr { display:flex; align-items:center; gap:7px; padding:9px 12px; background:var(--card2); border-bottom:1px solid var(--bdr2); }
.block-drag-handle { cursor:grab; color:var(--t3); padding:3px 4px; border-radius:5px; font-size:.95rem; line-height:1; user-select:none; transition:color .1s; }
.block-drag-handle:hover { color:var(--em-lt); background:var(--em-dim); }
.block-drag-handle:active { cursor:grabbing; }
.block-pill { font-size:.75rem; font-weight:600; padding:4px 10px; border-radius:6px; }
.dup-btn { display:flex; align-items:center; gap:4px; font-size:.74rem; color:var(--em-lt); cursor:pointer; padding:4px 9px; border-radius:7px; transition:background .12s; }
.dup-btn:hover { background:var(--em-dim); }
.block-occ { font-size:.7rem; color:var(--t2); }
.block-collapse-btn { cursor:pointer; color:var(--t3); padding:3px 6px; border-radius:5px; font-size:.78rem; line-height:1; user-select:none; transition:color .1s, transform .15s; margin-right:auto; }
.block-collapse-btn:hover { color:var(--em-lt); background:var(--em-dim); }
.block.collapsed .block-collapse-btn { transform:rotate(-90deg); }
.block.collapsed .lines { display:none; }
.block.collapsed .add-line-row { display:none; }
.block.collapsed .block-hdr { border-bottom:none; }
.collapse-all-btn { font-size:.74rem; color:var(--t2); cursor:pointer; padding:4px 10px; border-radius:7px; border:1px solid var(--bdr); transition:background .1s, color .1s; white-space:nowrap; }
.collapse-all-btn:hover { background:var(--em-dim); color:var(--em-lt); border-color:var(--em); }
.lines { padding:8px 12px 6px; }

/* ── Chord line ── */
.chord-line { display:flex; flex-wrap:wrap; align-items:flex-start; direction:rtl; min-height:44px; }
.seg { display:inline-flex; flex-direction:column; align-items:flex-start; cursor:pointer; min-width:4px; }
.seg:hover .lyr { background:var(--em-dim); border-radius:4px; }
.chord {
  font-family:'JetBrains Mono',monospace; font-size:.75rem; font-weight:600;
  color:var(--chord); background:var(--chord-bg); padding:2px 6px; border-radius:5px;
  margin-bottom:1px; direction:ltr; unicode-bidi:isolate; white-space:nowrap;
  cursor:pointer; transition:background .1s, box-shadow .1s;
}
.chord:hover { background:rgba(34,197,94,.22); box-shadow:0 0 0 1px var(--chord); }
.chord-ph { min-height:22px; display:block; }
.lyr { font-size:.97rem; line-height:1.5; color:var(--text); }
.add-line-row { padding:5px 0 3px; cursor:pointer; }
.add-line-row:hover span { color:var(--em-lt); }
.lyrics-mode .chord,
.lyrics-mode .chord-ph { display:none; }

/* ── Copy menu ── */
.copy-menu {
  position:fixed; top:52px; left:12px; right:12px; z-index:20;
  background:var(--card); border:1px solid var(--bdr); border-radius:var(--r);
  box-shadow:0 12px 44px rgba(0,0,0,.55); animation:fadeInDown .18s ease;
}
.copy-menu-title { font-size:.74rem; font-weight:600; color:var(--t2); padding:12px 16px 8px; }
.copy-opt { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; color:var(--text); transition:background .12s; }
.copy-opt:hover { background:var(--em-dim); }
.copy-opt svg { color:var(--em-lt); flex-shrink:0; }
.copy-opt-title { font-size:.9rem; font-weight:500; }
.copy-opt-desc  { font-size:.76rem; color:var(--t2); }
@keyframes fadeInDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }

/* ── Chord picker ── */
.chord-picker {
  position:fixed; bottom:var(--nav-h); left:0; right:0; z-index:20;
  background:var(--surf); border-top:1px solid var(--bdr); border-radius:18px 18px 0 0;
  box-shadow:0 -12px 48px rgba(0,0,0,.55);
  animation:slideUp .24s cubic-bezier(.32,1.1,.56,1);
  max-height:55vh; display:flex; flex-direction:column;
}
.picker-drag-bar { width:40px; height:4px; background:var(--bdr); border-radius:2px; margin:12px auto 7px; }
.picker-hdr { display:flex; align-items:center; justify-content:space-between; padding:0 16px 10px; }
.picker-title { font-size:.9rem; font-weight:600; color:var(--text); }
.picker-remove-btn { font-size:.82rem; color:#f87171; cursor:pointer; padding:5px 12px; border-radius:8px; background:rgba(239,68,68,.1); }
.picker-sugg { display:flex; gap:7px; padding:5px 14px 10px; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
.picker-sugg::-webkit-scrollbar { display:none; }
.sugg-chip {
  flex-shrink:0; padding:7px 14px; border-radius:9px;
  background:var(--em-dim); color:var(--em-lt); font-weight:600; font-size:.82rem;
  cursor:pointer; border:1px solid var(--em-glow); transition:background .1s, transform .08s;
}
.sugg-chip:hover { background:var(--em-glow); }
.sugg-chip:active { transform:scale(.9); }
.picker-kbd { display:flex; flex-wrap:wrap; gap:6px; padding:6px 14px 16px; overflow-y:auto; }
.kbd-btn {
  padding:6px 9px; border-radius:8px; font-size:.78rem; font-weight:500;
  background:var(--card); color:var(--text); border:1px solid var(--bdr);
  cursor:pointer; font-family:'JetBrains Mono',monospace; transition:background .1s;
}
.kbd-btn:hover { background:var(--em-dim); border-color:var(--em-lt); color:var(--em-lt); }
.kbd-btn.root { font-weight:700; color:var(--em-lt); }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:none; } }

/* ── Library ── */
.pinned-section { padding:12px 0 0; }
.section-lbl { font-size:.7rem; font-weight:700; color:var(--t2); letter-spacing:.06em; text-transform:uppercase; padding:0 16px; }
.pin-cards { display:flex; gap:12px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; }
.pin-cards::-webkit-scrollbar { display:none; }
.pin-card {
  flex-shrink:0; min-width:140px; background:var(--card); border:1px solid var(--bdr);
  border-radius:var(--r); padding:14px; cursor:pointer; transition:border-color .15s, background .15s, transform .15s;
}
.pin-card:hover { border-color:var(--em-lt); background:var(--card2); transform:translateY(-2px); }
.pin-card-title { font-size:.92rem; font-weight:600; margin-bottom:4px; }
.pin-card-key   { font-size:.74rem; color:var(--t2); margin-bottom:8px; }
.song-list { padding:4px 0; }
.song-item {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--bdr2); cursor:pointer; transition:background .12s;
}
.song-item:hover { background:var(--card); }
.song-ico { flex-shrink:0; }
.song-info { flex:1; min-width:0; }
.song-title { font-size:.97rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-meta  { font-size:.76rem; color:var(--t2); margin-top:3px; }
.song-key   { background:var(--em-dim); color:var(--em-lt); padding:2px 7px; border-radius:5px; font-size:.72rem; font-weight:600; }
.fab {
  position:fixed; bottom:calc(var(--nav-h) + 16px); left:16px;
  background:var(--em); color:#fff; border-radius:50px; padding:13px 22px;
  display:flex; align-items:center; gap:7px; font-size:.92rem; font-weight:600;
  box-shadow:0 4px 24px rgba(13,148,136,.45); cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.fab:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(13,148,136,.6); }
.fab:active { transform:scale(.94); }

/* ── Badges ── */
.badge    { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:600; }
.b-draft  { background:rgba(148,163,184,.12); color:#94a3b8; }
.b-wip    { background:rgba(251,191,36,.12);  color:#fbbf24; }
.b-done   { background:rgba(34,197,94,.12);   color:#22c55e; }

/* ── Structure screen ── */
.arr-editor-wrap { padding:16px; }
.arr-ed-label { font-size:.74rem; font-weight:600; color:var(--t2); margin-bottom:10px; }
.arr-flow { display:flex; flex-wrap:wrap; gap:8px; }
.arr-node {
  padding:8px 14px; border-radius:10px; border:1px solid;
  font-size:.82rem; font-weight:700; font-family:'JetBrains Mono',monospace;
  display:flex; align-items:center; gap:5px; cursor:grab; user-select:none; transition:opacity .15s;
}
.arr-node.dragging  { opacity:.4; }
.arr-node.drag-over { box-shadow:0 0 0 2px var(--em-lt); }
.an-drag { font-size:.82rem; opacity:.5; }
.struct-summary {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px;
  background:var(--bdr); border-top:1px solid var(--bdr); border-bottom:1px solid var(--bdr);
}
.sum-row { background:var(--card); padding:12px 16px; display:flex; flex-direction:column; gap:3px; }
.sum-row span:first-child { font-size:.72rem; color:var(--t2); }
.sum-row span:last-child  { font-size:1rem; font-weight:600; color:var(--em-lt); }
.block-list { padding:10px 0 80px; }
.bl-row { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--bdr2); }
.bl-pill { flex-shrink:0; font-size:.7rem; font-weight:600; padding:4px 10px; border-radius:7px; }
.bl-info { flex:1; min-width:0; }
.bl-preview { font-size:.85rem; color:var(--t2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bl-chords  { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.ch-tag { font-size:.72rem; font-family:'JetBrains Mono',monospace; padding:2px 6px; border-radius:5px; background:var(--chord-bg); color:var(--chord); }
.bl-occ { font-size:.74rem; color:var(--t3); margin-top:5px; display:flex; align-items:center; gap:4px; }

/* ── Lyric text input ── */
.lyric-input {
  width:100%; border:none; background:transparent; color:var(--text);
  font-family:'Rubik','Segoe UI','Arial Hebrew',sans-serif; font-size:.97rem; line-height:1.6;
  padding:3px 0; outline:none; caret-color:var(--em-lt);
  border-bottom:1px solid transparent; transition:border-color .15s;
}
.lyric-input:focus { border-bottom-color:var(--em); }
.lyric-input::placeholder { color:var(--t3); }
.lyrics-mode .lyric-input { caret-color:var(--em-lt); }

/* ── Song title input ── */
.song-title-input {
  flex:1; min-width:0; border:none; background:transparent; color:var(--text);
  font-family:inherit; font-size:.95rem; font-weight:600; padding:0; outline:none;
  caret-color:var(--em-lt);
}
.song-title-input::placeholder { color:var(--t3); }

/* ── Modal ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:50;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-box {
  background:var(--card); border:1px solid var(--bdr); border-radius:18px;
  padding:24px 22px; width:88%; max-width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.modal-title { font-size:1rem; font-weight:600; margin-bottom:16px; color:var(--text); }
.modal-input {
  width:100%; background:var(--surf); border:1px solid var(--bdr); border-radius:10px;
  padding:12px 14px; color:var(--text); font-family:inherit; font-size:1rem; outline:none;
  transition:border-color .15s; caret-color:var(--em-lt);
}
.modal-input:focus { border-color:var(--em); box-shadow:0 0 0 3px var(--em-dim); }
.modal-actions { display:flex; gap:8px; margin-top:18px; justify-content:flex-start; }
.modal-cancel { padding:10px 16px; border-radius:9px; cursor:pointer; color:var(--t2); font-size:.9rem; }
.modal-cancel:hover { background:var(--em-dim); }
.modal-confirm { padding:10px 20px; border-radius:9px; background:var(--em); color:#fff; font-size:.9rem; font-weight:600; cursor:pointer; }
.modal-confirm:hover { background:var(--em-lt); }

/* ── Animations ── */
.screen-anim { animation:screenIn .2s ease both; }
@keyframes screenIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.list-anim { animation:listIn .22s ease both; animation-delay:calc(var(--i,0)*35ms); }
@keyframes listIn { from{opacity:0;transform:translateX(8px)} to{opacity:1;transform:none} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes chordPop  { from{transform:scale(.3);opacity:0} 70%{transform:scale(1.12)} to{transform:scale(1);opacity:1} }
@keyframes perfSlide { from{transform:translateY(80px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes cdFade    { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
.word-chip .chord { animation:chordPop .2s cubic-bezier(.34,1.56,.64,1) both; }
.perf-screen { animation:perfSlide .28s cubic-bezier(.25,.46,.45,.94) both; }
.cd-wrap { animation:cdFade .2s ease both; }
.cd-wrap:nth-child(1){animation-delay:0ms}.cd-wrap:nth-child(2){animation-delay:40ms}
.cd-wrap:nth-child(3){animation-delay:80ms}.cd-wrap:nth-child(4){animation-delay:120ms}
.cd-wrap:nth-child(5){animation-delay:160ms}.cd-wrap:nth-child(6){animation-delay:200ms}
.cd-wrap:nth-child(7){animation-delay:240ms}.cd-wrap:nth-child(8){animation-delay:280ms}
.hdr-icon-btn { transition:transform .1s, color .15s; }
.perf-tp-btn { transition:transform .1s, background .1s; }
.perf-tp-btn:active { transform:scale(.88) !important; }
.sugg-chip { transition:transform .08s, background .12s; }
.fab { transition:transform .12s, box-shadow .15s; }
.nav-btn { transition:color .15s, transform .1s; }
.nav-btn:active { transform:scale(.9); }

/* ── Library filter tabs ── */
.lib-tabs {
  display:flex; gap:0; padding:0 12px; border-bottom:1px solid var(--bdr2);
  background:var(--surf); overflow-x:auto; scrollbar-width:none;
}
.lib-tabs::-webkit-scrollbar { display:none; }
.lib-tab {
  padding:11px 14px; font-size:.82rem; font-weight:500; color:var(--t2);
  cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
  transition:color .15s, border-color .15s;
}
.lib-tab.on { color:var(--em-lt); border-bottom-color:var(--em-lt); font-weight:600; }

/* ── Song context menu button ── */
.song-menu-btn {
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; color:var(--t2); flex-shrink:0; cursor:pointer; transition:background .12s;
}
.song-menu-btn:hover { background:var(--em-dim); color:var(--em-lt); }

/* ── Context popup ── */
.ctx-popup {
  position:fixed; background:var(--card); border:1px solid var(--bdr);
  border-radius:var(--r); box-shadow:0 12px 44px rgba(0,0,0,.6); z-index:38;
  overflow:hidden; min-width:170px; animation:fadeIn .14s ease;
}
.ctx-item {
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  cursor:pointer; color:var(--text); font-size:.9rem; transition:background .12s;
}
.ctx-item:hover { background:var(--em-dim); }
.ctx-item.danger { color:#f87171; }
.ctx-item.danger:hover { background:rgba(239,68,68,.1); }

/* ── Bottom sheet ── */
.sheet-ov {
  position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:45;
  display:flex; align-items:flex-end; animation:fadeIn .18s ease; backdrop-filter:blur(2px);
}
.sheet-pn {
  width:100%; background:var(--surf); border-radius:20px 20px 0 0;
  padding-bottom:env(safe-area-inset-bottom, 14px);
  animation:slideUp .26s cubic-bezier(.32,1.1,.56,1); max-height:84vh; overflow-y:auto;
}
.sheet-drag { width:40px; height:4px; background:var(--bdr); border-radius:2px; margin:12px auto 8px; }
.sheet-title { font-size:.95rem; font-weight:600; padding:5px 18px 14px; color:var(--text); border-bottom:1px solid var(--bdr2); }
.sheet-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--bdr2); font-size:.9rem; color:var(--text); cursor:default;
}
.sheet-lbl { font-size:.8rem; color:var(--t2); }

/* ── Key selector grid ── */
.key-grid { display:flex; flex-wrap:wrap; gap:6px; padding:14px 18px 12px; }
.key-btn {
  padding:6px 9px; border-radius:8px; font-size:.8rem; font-weight:600;
  background:var(--card); color:var(--text); border:1px solid var(--bdr);
  cursor:pointer; font-family:'JetBrains Mono',monospace; min-width:40px; text-align:center;
  transition:background .1s, border-color .1s;
}
.key-btn:hover { background:var(--em-dim); border-color:var(--em-lt); }
.key-btn.on { background:var(--em); color:#fff; border-color:var(--em); }

/* ── Status row ── */
.status-row { display:flex; gap:7px; padding:12px 18px; }
.status-btn {
  flex:1; padding:8px 4px; border-radius:9px; text-align:center;
  font-size:.82rem; font-weight:600; cursor:pointer; border:1px solid var(--bdr);
  background:var(--card); color:var(--t2); transition:all .12s;
}
.status-btn.on { border-color:var(--em); background:var(--em-dim); color:var(--em-lt); }

/* ── Sheet action buttons ── */
.sheet-action-row { padding:14px 18px; display:flex; gap:9px; }
.sheet-btn {
  flex:1; padding:12px; border-radius:10px; text-align:center;
  font-size:.92rem; font-weight:600; cursor:pointer; border:none; transition:background .12s;
}
.sheet-btn-primary { background:var(--em); color:#fff; }
.sheet-btn-primary:hover { background:var(--em-lt); }
.sheet-btn-ghost { background:var(--em-dim); color:var(--em-lt); }
.sheet-btn-ghost:hover { background:var(--em-glow); }
.sheet-btn-danger { background:rgba(239,68,68,.12); color:#f87171; }
.sheet-btn-danger:hover { background:rgba(239,68,68,.22); }

/* ── Num control (BPM/Capo) ── */
.num-ctrl { display:flex; align-items:center; gap:12px; }
.num-btn {
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; background:var(--em-dim); color:var(--em-lt); cursor:pointer; font-size:1.1rem; font-weight:700;
}
.num-val { min-width:36px; text-align:center; font-weight:600; font-family:'JetBrains Mono',monospace; }

/* ── Block type picker ── */
.type-grid { display:flex; flex-wrap:wrap; gap:7px; padding:14px 18px; }
.type-btn {
  padding:7px 14px; border-radius:9px; font-size:.8rem; font-weight:600;
  cursor:pointer; border:1px solid; transition:opacity .12s, box-shadow .12s;
}
.type-btn:hover { opacity:.8; }
.type-btn.on { box-shadow:0 0 0 2px var(--em-lt); }

/* ── Line delete ── */
.line-del-btn {
  width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  border-radius:5px; color:var(--t3); flex-shrink:0; cursor:pointer;
  opacity:0; transition:opacity .15s, color .15s;
}
.line-pair:hover .line-del-btn,
.line-pair:focus-within .line-del-btn { opacity:1; }
.line-del-btn:hover { color:#f87171; }

/* ── Performance mode ── */
.perf-screen {
  position:fixed; inset:0; background:var(--bg); z-index:60; display:flex; flex-direction:column;
}
.perf-hdr {
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:var(--surf); border-bottom:1px solid var(--bdr); flex-shrink:0;
}
.perf-title { flex:1; font-size:.95rem; font-weight:600; color:var(--text); }
.perf-scroll { flex:1; overflow-y:auto; padding:18px 16px 90px; }
.perf-block { margin-bottom:30px; }
.perf-block-lbl { font-size:.7rem; font-weight:700; color:var(--t2); margin-bottom:10px; text-transform:uppercase; letter-spacing:.07em; }
.perf-line { margin-bottom:14px; }
.perf-chord-row { display:flex; flex-wrap:wrap; direction:rtl; }
.perf-seg { display:inline-flex; flex-direction:column; align-items:flex-start; }
.perf-chord { font-family:'JetBrains Mono',monospace; font-size:.92rem; font-weight:700;
  color:var(--chord); padding:2px 6px; border-radius:5px; background:var(--chord-bg);
  margin-bottom:4px; direction:ltr; unicode-bidi:isolate; white-space:nowrap; }
.perf-chord-ph { min-height:24px; display:block; }
.perf-lyr { font-size:1.4rem; line-height:1.6; color:var(--text); }
.perf-lyrics-only .perf-chord,
.perf-lyrics-only .perf-chord-ph { display:none; }
.perf-lyrics-only .perf-lyr { font-size:1.6rem; }
.perf-lyrbtn-on { color:var(--em-lt) !important; }
.perf-transpose { display:flex; align-items:center; gap:4px; }
.perf-tp-btn { width:28px; height:28px; border-radius:8px; border:1px solid var(--bdr);
  background:var(--surf); color:var(--text); font-size:1.1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0; }
.perf-tp-val { font-size:.8rem; font-weight:700; color:var(--chord); min-width:24px; text-align:center; font-family:'JetBrains Mono',monospace; }
.perf-chord-diagrams { display:flex; gap:12px; overflow-x:auto; padding:12px 16px 14px;
  margin-bottom:14px; border-bottom:1px solid var(--bdr); flex-shrink:0;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.perf-chord-diagrams::-webkit-scrollbar { display:none; }
.cd-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0; cursor:default; }
.cd-name { font-size:.64rem; font-weight:700; color:var(--chord); letter-spacing:.02em; font-family:'JetBrains Mono',monospace; }
.cd-svg  { display:block; overflow:visible; }
.perf-scroll-on { color:var(--em-lt) !important; }

/* ── Search overlay ── */
.search-overlay {
  position:fixed; inset:0; background:var(--bg); z-index:30;
  animation:fadeIn .15s ease; display:flex; flex-direction:column;
}
.search-hdr { display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:var(--surf); border-bottom:1px solid var(--bdr); }
.search-input {
  flex:1; border:1px solid var(--bdr); background:var(--card); border-radius:10px;
  padding:10px 14px; color:var(--text); font-family:inherit; font-size:1rem; outline:none; caret-color:var(--em-lt);
}
.search-input:focus { border-color:var(--em); }
.search-cancel { color:var(--em-lt); font-size:.88rem; cursor:pointer; padding:5px 10px; white-space:nowrap; }

/* ── Empty state ── */
.empty-state { padding:60px 24px 50px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; }
.empty-emblem { animation:emGlow 2.6s ease-in-out infinite; }
@keyframes emGlow { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.07)} }
.empty-title { font-size:1.1rem; font-weight:700; color:var(--text); }
.empty-sub { font-size:.9rem; color:var(--t2); max-width:230px; }
.empty-create-btn { padding:14px 32px; background:var(--em); color:#fff; border-radius:50px; font-size:.95rem; font-weight:600; cursor:pointer; box-shadow:0 4px 20px rgba(13,148,136,.4); }

/* ── Sync dot pulse ── */
.sync-dot-pulse { animation:dotPulse 1.2s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Safe-area insets ── */
.bot-nav {
  height:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
#root { bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
.chord-picker { bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
.fab { bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); }
.toast { bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); }

/* ── Global touch UX ── */
* { -webkit-tap-highlight-color: transparent; }
button, .nav-btn, .hdr-icon-btn, .top-act-btn, .fab, .lib-tab,
.song-item, .pl-item, .word-chip, .kbd-btn, .sugg-chip,
.block-drag-handle, .nav-back, .song-menu-btn, .ctx-item,
.sheet-btn, .key-btn, .status-btn, .type-btn, .modal-cancel,
.modal-confirm, .empty-create-btn, .collapse-all-btn {
  touch-action: manipulation;
}

  .perf-chord-ph  { min-height:30px; }
  .perf-lyr       { font-size:1.65rem; line-height:1.7; }
  .perf-lyrics-only .perf-lyr { font-size:1.85rem; }
  .perf-scroll    { padding:18px 16px 110px; }
  .perf-nav-btn   { width:46px; height:46px; border-radius:9px; }

  .copy-menu      { top:auto; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px); border-radius:16px; }
  .copy-opt       { padding:15px 18px; gap:14px; min-height:58px; }
  .copy-opt-title { font-size:.95rem; }
  .copy-opt-desc  { font-size:.8rem; }
}

/* ── Song tags ── */
.song-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.tag-chip {
  font-size:.68rem; font-weight:600; padding:2px 8px; border-radius:999px;
  background:rgba(167,139,250,.14); color:#a78bfa; border:1px solid rgba(167,139,250,.3);
}

/* ── Line drag handle ── */
.line-drag-handle {
  cursor:grab; color:var(--t3); font-size:.82rem; line-height:1;
  padding:3px; user-select:none; opacity:0; transition:opacity .12s, color .1s; flex-shrink:0;
}
.line-pair:hover .line-drag-handle,
.line-pair:focus-within .line-drag-handle { opacity:1; }
.line-drag-handle:hover { color:var(--em-lt); }
.line-pair.line-dragging { opacity:.35; }
.line-pair.line-drag-over { border-top:2px solid var(--em-lt); }
@media (hover:none) { .line-drag-handle { opacity:.5; } }

/* ── Voice memo panel ── */
.memo-panel { background:var(--surf); border-bottom:1px solid var(--bdr); padding:10px 16px 12px; }
.memo-panel-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.memo-rec-btn {
  display:flex; align-items:center; gap:7px; padding:8px 16px; border-radius:10px;
  background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.3);
  cursor:pointer; font-family:inherit; font-size:.85rem; font-weight:600; transition:background .12s;
}
.memo-rec-btn:hover { background:rgba(239,68,68,.22); }
.memo-rec-btn.recording { background:rgba(239,68,68,.3); animation:recPulse 1s ease-in-out infinite; }
@keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)} 50%{box-shadow:0 0 0 7px rgba(248,113,113,0)} }
.memo-player-wrap { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.memo-audio { flex:1; min-width:0; height:38px; border-radius:9px; }
.memo-del-btn { font-size:1.05rem; cursor:pointer; padding:4px; color:var(--t2); transition:color .12s; }
.memo-del-btn:hover { color:#f87171; }
.hdr-icon-btn#memoBtn.recording { color:#f87171; }

/* ── Playlists ── */
.pl-item {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--bdr2); cursor:pointer; transition:background .12s;
}
.pl-item:hover { background:var(--card); }
.pl-ico { flex-shrink:0; }
.pl-info { flex:1; min-width:0; }
.pl-name { font-size:.95rem; font-weight:500; }
.pl-count { font-size:.74rem; color:var(--t2); margin-top:3px; }
.pl-drag-handle { cursor:grab; color:var(--t3); font-size:.88rem; padding:3px 4px; user-select:none; flex-shrink:0; transition:color .1s; }
.pl-drag-handle:hover { color:var(--em-lt); }

/* ── New playlist modal extra buttons ── */
.modal-btns { display:flex; gap:8px; margin-top:18px; justify-content:flex-start; }
.modal-btn-pri { padding:10px 20px; border-radius:9px; background:var(--em); color:#fff; font-size:.92rem; font-weight:600; cursor:pointer; }
.modal-btn-pri:hover { background:var(--em-lt); }
.modal-btn-sec { padding:10px 16px; border-radius:9px; color:var(--t2); font-size:.92rem; cursor:pointer; }
.modal-btn-sec:hover { background:var(--em-dim); }

/* ── Setlist prev/next ── */
.perf-setlist-nav { display:flex; align-items:center; gap:7px; }
.perf-nav-btn {
  width:32px; height:32px; border-radius:8px; border:1px solid var(--bdr);
  background:var(--surf); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.perf-nav-btn:hover { background:var(--em-dim); border-color:var(--em); color:var(--em-lt); }
.perf-nav-btn:disabled { opacity:.3; cursor:default; }

/* ── .mob — JS-detected mobile, works in GAS iframes ── */
html.mob{--nav-h:72px;font-size:17px;}
html.mob body{max-width:var(--sw);overflow:hidden;}
html.mob #root{width:var(--sw);}
html.mob .bot-nav{width:var(--sw)!important;}
html.mob .chord-picker{width:var(--sw)!important;left:0!important;right:auto!important;}
html.mob .modal-overlay{width:var(--sw);}
html.mob .copy-menu{left:12px!important;right:auto!important;width:calc(var(--sw) - 24px)!important;}
html.mob .sheet-ov{width:var(--sw)!important;}
html.mob .perf-screen{width:var(--sw)!important;}
html.mob .search-overlay{width:var(--sw)!important;}
html.mob #stale-banner{width:var(--sw)!important;}
html.mob .toast{max-width:calc(var(--sw) - 32px)!important;}
html.mob .fab{left:16px!important;padding:16px 28px;font-size:1rem;}
html.mob .chord-add-hint{opacity:.4;}
html.mob .line-del-btn{opacity:.7;width:44px;height:44px;}
html.mob .lyric-input{font-size:1rem;line-height:1.75;padding:5px 0;}
html.mob .word-lyr{font-size:1rem;}
html.mob .song-title-input,html.mob .search-input,html.mob .modal-input,html.mob .sheet-text-input,html.mob .picker-search{font-size:1rem;}
html.mob .modal-input,html.mob .sheet-text-input{padding:14px;}
html.mob .nav-lbl{font-size:.72rem;}
html.mob .nav-ico{width:26px;height:26px;}
html.mob .nav-btn{gap:5px;}
html.mob .app-hdr{padding:12px 14px;}
html.mob .ali-oren,html.mob .ali-book{font-size:1.15rem;}
html.mob .hdr-icon-btn{width:46px;height:46px;border-radius:12px;}
html.mob .lib-tab{padding:13px;font-size:.88rem;}
html.mob .song-item{padding:16px;min-height:68px;gap:14px;}
html.mob .song-title{font-size:1.02rem;}
html.mob .song-meta{font-size:.82rem;margin-top:4px;}
html.mob .song-menu-btn{width:46px;height:46px;}
html.mob .pin-card{min-width:150px;padding:16px;}
html.mob .empty-state{padding:52px 24px 130px;gap:20px;}
html.mob .empty-title{font-size:1.6rem;font-weight:700;}
html.mob .empty-sub{font-size:1rem;}
html.mob .empty-create-btn{padding:17px 44px;font-size:1.05rem;min-height:56px;}
html.mob .modal-box{width:92%;padding:24px 20px;border-radius:20px;}
html.mob .modal-title{font-size:1.05rem;}
html.mob .modal-confirm,html.mob .modal-cancel{padding:14px 22px;font-size:1rem;min-height:50px;border-radius:10px;}
html.mob .song-nav-bar{flex-wrap:wrap;padding:9px 10px 5px;gap:4px;}
html.mob .nav-back,html.mob .top-act-btn{width:46px;height:46px;border-radius:12px;}
html.mob .collapse-all-btn{padding:9px 16px;font-size:.88rem;min-height:40px;}
html.mob .song-hdr-name{font-size:1rem;}
html.mob .block{border-radius:12px;}
html.mob .block-hdr{padding:11px 14px;gap:9px;}
html.mob .block-pill{font-size:.82rem;padding:6px 14px;min-height:36px;}
html.mob .block-drag-handle{font-size:1.15rem;padding:5px 7px;min-height:36px;}
html.mob .dup-btn{padding:6px 12px;font-size:.82rem;min-height:36px;}
html.mob .line-pair{padding:5px 8px 10px;margin-bottom:12px;}
html.mob .word-chip{padding:5px 8px;min-height:50px;}
html.mob .chord{font-size:.82rem;padding:2px 7px;}
html.mob .chord-picker{max-height:62vh;border-radius:20px 20px 0 0;}
html.mob .sugg-chip{padding:11px 18px;font-size:.92rem;min-height:46px;}
html.mob .kbd-btn{padding:13px 11px;font-size:.88rem;min-width:44px;min-height:48px;}
html.mob .ctx-item{padding:15px 18px;font-size:.95rem;min-height:52px;}
html.mob .sheet-row{padding:16px 18px;font-size:.95rem;min-height:54px;}
html.mob .sheet-btn{padding:15px;font-size:1rem;min-height:52px;}
html.mob .key-btn{min-width:46px;min-height:46px;font-size:.88rem;}
html.mob .status-btn{padding:11px 4px;font-size:.88rem;min-height:46px;}
html.mob .num-btn{width:46px;height:46px;font-size:1.25rem;}
html.mob .type-btn{padding:10px 18px;font-size:.88rem;min-height:46px;}
html.mob .perf-tp-btn{width:46px;height:46px;font-size:1.35rem;}
html.mob .perf-lyr{font-size:1.65rem;line-height:1.7;}
html.mob .perf-lyrics-only .perf-lyr{font-size:1.85rem;}
html.mob .copy-menu{top:auto;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);border-radius:16px;}
html.mob .copy-opt{padding:15px 18px;min-height:58px;}
html.mob .line-drag-handle{opacity:.5;}
</style>
</head>

<div id="stale-banner">גרסה ישנה – יש מנהל (F5)</div>

<!-- New song modal -->
<div id="newSongModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title">שיר חדש</div>
    <input id="newSongInput" class="modal-input" type="text" dir="auto" autocomplete="off"
      placeholder="שם השיר"
      onkeydown="if(event.key==='Enter')APP.confirmNewSong()">
    <div class="modal-actions">
      <div class="modal-cancel" onclick="APP.cancelNewSong()">ביטול</div>
      <div class="modal-confirm" onclick="APP.confirmNewSong()">צור שיר</div>
    </div>
  </div>
</div>


<!-- Search overlay -->
<div id="searchOverlay" style="display:none">
  <div class="search-overlay">
    <div class="search-hdr">
      <input id="searchInput" class="search-input" type="search" dir="rtl" autocomplete="off"
        placeholder="חיפוש שירים..." oninput="APP.filterSongs(this.value)">
      <span class="search-cancel" onclick="APP.closeSearch()">ביטול</span>
    </div>
    <div id="searchResults" style="overflow-y:auto;flex:1;padding:4px 0"></div>
  </div>
</div>

<!-- Song settings sheet -->
<div id="songSheet" style="display:none">
  <div class="sheet-ov" onclick="APP.closeSongSheet()">
    <div class="sheet-pn" onclick="event.stopPropagation()">
      <div class="sheet-drag"></div>
      <div class="sheet-title" id="sheetSongTitle">הגדרות שיר</div>
      <div class="sheet-row" style="border-bottom:none;padding-bottom:4px"><span class="sheet-lbl">סולם</span></div>
      <div class="key-grid" id="keyGrid"></div>
      <div class="sheet-row" style="border-bottom:none;padding-bottom:0"><span class="sheet-lbl">סטטוס</span></div>
      <div class="status-row">
        <div class="status-btn" id="st-draft" onclick="APP.setSheetStatus('draft')">טיוטה</div>
        <div class="status-btn" id="st-wip" onclick="APP.setSheetStatus('wip')">בכתיבה</div>
        <div class="status-btn" id="st-done" onclick="APP.setSheetStatus('done')">גמור</div>
      </div>
      <div class="sheet-row">
        <span>BPM</span>
        <div class="num-ctrl">
          <div class="num-btn" onclick="APP.adjustBpm(-5)">−</div>
          <span class="num-val" id="bpmVal">—</span>
          <div class="num-btn" onclick="APP.adjustBpm(5)">+</div>
        </div>
      </div>
      <div class="sheet-row">
        <span>קפו</span>
        <div class="num-ctrl">
          <div class="num-btn" onclick="APP.adjustCapo(-1)">−</div>
          <span class="num-val" id="capoVal">0</span>
          <div class="num-btn" onclick="APP.adjustCapo(1)">+</div>
        </div>
      </div>
      <div class="sheet-row" onclick="APP.togglePinInSheet()" style="cursor:pointer">
        <span>נעיצה</span>
        <span id="pinToggleIco" style="font-size:.85rem;color:var(--t2)">☐</span>
      </div>
      <div class="sheet-row" style="border-bottom:none;padding-bottom:4px"><span class="sheet-lbl">כותב מילים</span></div>
      <div style="padding:0 16px 10px"><input class="sheet-text-input" id="sheetWriter" dir="rtl" placeholder="שם הכותב (אופציונלי)..."></div>
      <div class="sheet-row" style="border-bottom:none;padding-bottom:4px"><span class="sheet-lbl">מלחין</span></div>
      <div style="padding:0 16px 12px"><input class="sheet-text-input" id="sheetComposer" dir="rtl" placeholder="שם המלחין (אופציונלי)..."></div>
      <div class="sheet-row" style="border-bottom:none;padding-bottom:4px"><span class="sheet-lbl">תגיות</span></div>
      <div style="padding:0 16px 12px"><input class="sheet-text-input" id="sheetTags" dir="rtl" placeholder="רוק, פופ, חגיגי (מופרד בפסיקים)..."></div>
      <div class="sheet-action-row">
        <div class="sheet-btn sheet-btn-primary" onclick="APP.saveSongSheet()">שמור</div>
        <div class="sheet-btn sheet-btn-danger" onclick="APP.confirmDeleteFromSheet()">מחק שיר</div>
      </div>
    </div>
  </div>
</div>

<!-- Block type picker sheet -->
<div id="blockTypeSheet" style="display:none">
  <div class="sheet-ov" onclick="APP.closeBlockTypeSheet()">
    <div class="sheet-pn" onclick="event.stopPropagation()">
      <div class="sheet-drag"></div>

// === db.js ===
'use strict';
var DB = (function () {
  var _db = null;

  function _open() {
    if (_db) return Promise.resolve(_db);
    return new Promise(function (res, rej) {
      var req = indexedDB.open('OrenSongBook', 2);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('songs'))
          db.createObjectStore('songs', { keyPath: 'SongID' });
        if (!db.objectStoreNames.contains('queue'))
          db.createObjectStore('queue', { autoIncrement: true });
        if (!db.objectStoreNames.contains('playlists'))
          db.createObjectStore('playlists', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('memos'))
          db.createObjectStore('memos', { keyPath: 'songId' });
      };
      req.onsuccess = function (e) { _db = e.target.result; res(_db); };
      req.onerror   = function (e) { rej(e); };
    });
  }

  function _tx(store, mode, fn) {
    return _open().then(function (db) {
      return new Promise(function (res, rej) {
        var tx  = db.transaction(store, mode);
        var st  = tx.objectStore(store);
        var req = fn(st);
        req.onsuccess = function () { res(req.result); };
        req.onerror   = function (e) { rej(e); };
      });
    });
  }

  function _getAll(store) {
    return _open().then(function (db) {
      return new Promise(function (res, rej) {
        var req = db.transaction(store, 'readonly').objectStore(store).getAll();
        req.onsuccess = function () { res(req.result || []); };
        req.onerror   = rej;
      });
    });
  }

  // ── Songs ──────────────────────────────────────────────────────────────
  function getAllSongs()  { return _getAll('songs'); }
  function getSong(id)   { return _tx('songs', 'readonly',  function (s) { return s.get(id); }); }
  function saveSong(song){ return _tx('songs', 'readwrite', function (s) { return s.put(song); }); }

  // ── Sync queue ─────────────────────────────────────────────────────────
  function enqueue(op) {
    return _open().then(function (db) {
      return new Promise(function (res, rej) {
        var req = db.transaction('queue', 'readwrite').objectStore('queue').add(op);
        req.onsuccess = function () { res(req.result); };
        req.onerror   = rej;
      });
    });
  }

  function dequeueAll() {
    return _open().then(function (db) {
      return new Promise(function (res, rej) {
        var items = [];
        var req = db.transaction('queue', 'readonly').objectStore('queue').openCursor();
        req.onsuccess = function (e) {
          var c = e.target.result;
          if (c) { items.push({ key: c.key, value: c.value }); c.continue(); }
          else res(items);
        };
        req.onerror = rej;
      });
    });
  }

  function removeQueueItem(key) {
    return _tx('queue', 'readwrite', function (s) { return s.delete(key); });
  }

  // ── Playlists ──────────────────────────────────────────────────────────
  function getAllPlaylists()      { return _getAll('playlists'); }
  function getPlaylist(id)        { return _tx('playlists', 'readonly',  function (s) { return s.get(id); }); }
  function savePlaylist(pl)       { return _tx('playlists', 'readwrite', function (s) { return s.put(pl); }); }
  function deletePlaylist(id)     { return _tx('playlists', 'readwrite', function (s) { return s.delete(id); }); }

  // ── Voice memos ────────────────────────────────────────────────────────
  function getMemo(songId)        { return _tx('memos', 'readonly',  function (s) { return s.get(songId); }); }
  function saveMemo(songId, data) { return _tx('memos', 'readwrite', function (s) { return s.put({ songId: songId, data: data, ts: Date.now() }); }); }
  function deleteMemo(songId)     { return _tx('memos', 'readwrite', function (s) { return s.delete(songId); }); }

  return {
    getAllSongs: getAllSongs, getSong: getSong, saveSong: saveSong,
    enqueue: enqueue, dequeueAll: dequeueAll, removeQueueItem: removeQueueItem,
    getAllPlaylists: getAllPlaylists, getPlaylist: getPlaylist,
    savePlaylist: savePlaylist, deletePlaylist: deletePlaylist,
    getMemo: getMemo, saveMemo: saveMemo, deleteMemo: deleteMemo,
  };
})();


// === sync.js ===
'use strict';
var SYNC = (function () {
  var _timer  = null;
  var _active = false;

  function schedule() {
    if (_timer) clearTimeout(_timer);
    _timer = setTimeout(_flush, 1500);
    _setStatus('pending');
  }

  function _flush() {
    if (_active) return;
    _active = true;
    DB.dequeueAll().then(function (items) {
      if (!items.length) { _active = false; _setStatus('ok'); return; }
      var item = items[0];
      srv('apiSaveSong', item.value)
        .then(function (r) {
          if (r && r.ok) {
            return DB.removeQueueItem(item.key).then(function () {
              _active = false;
              _flush();
            });
          } else if (r && r.error === 'conflict') {
            _active = false;
            _setStatus('conflict');
            if (typeof APP !== 'undefined') APP.onConflict(r, item.value);
          } else {
            _active = false;
            _setStatus('error');
          }
        })
        .catch(function () { _active = false; _setStatus('error'); });
    });
  }

  function _setStatus(state) {
    var el = document.getElementById('syncStatus');
    if (!el) return;
    var msgs = { pending: 'שומר...', ok: 'שמור', error: 'שגיאת שמירה', conflict: 'עדכן לגרסה חדשה' };
    el.textContent = msgs[state] || state;
    el.dataset.state = state;
  }

  return { schedule: schedule };
})();


// === undo.js ===
'use strict';
var UNDO = (function () {
  var _stack = [];
  var MAX    = 25;

  function push(snapshot) {
    _stack.push(JSON.stringify(snapshot));
    if (_stack.length > MAX) _stack.shift();
    _updateButtons();
  }

  function pop() {
    if (!_stack.length) return null;
    var s = _stack.pop();
    _updateButtons();
    return JSON.parse(s);
  }

  function canUndo() { return _stack.length > 0; }
  function clear()   { _stack = []; _updateButtons(); }

  function _updateButtons() {
    var on = canUndo();
    ['undoBtn'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.style.opacity      = on ? '1' : '0.35';
        el.style.pointerEvents = on ? 'auto' : 'none';
      }
    });
  }

  return { push: push, pop: pop, canUndo: canUndo, clear: clear };
})();

  function _lineToSegments(lyrics, chords) {
    var chars  = Array.from(lyrics || '');
    var sorted = (chords || []).slice().sort(function (a, b) { return a.at - b.at; });
    var segs   = [];
    var prev   = 0;
    for (var i = 0; i < sorted.length; i++) {
      var c  = sorted[i];
      var at = Math.min(c.at, chars.length);
      var nextAt = i + 1 < sorted.length ? Math.min(sorted[i+1].at, chars.length) : chars.length;
      if (at > prev) {
        segs.push({ chord: null, lyr: chars.slice(prev, at).join(''), at: prev });
      }
      segs.push({ chord: c.name, lyr: chars.slice(at, nextAt).join(''), at: at });
      prev = nextAt;
    }
    if (prev < chars.length) {
      segs.push({ chord: null, lyr: chars.slice(prev).join(''), at: prev });
    }
    if (!segs.length) {
      segs.push({ chord: null, lyr: lyrics || '', at: 0 });

        '<div class="app-logo-inline">' + _EMBLEM +
          '<span class="ali-oren">Oren</span><span class="ali-book">&nbsp;Song Book</span>' +
        '</div>' +
        '<div class="hdr-icon-btn" title="סטליסט חדש" onclick="APP.newPlaylist()"><svg width="17" height="17"><use href="#ico-plus"/></svg></div>' +

        '<svg width="14" height="14"><use href="#ico-plus"/></svg> סטליסט חדש' +
      '</div>';

    _setBottomNav('library');

  // ── Editor ─────────────────────────────────────────────────────────────
  function renderEditor(song, doc) {
    _screen = 'editor';
    _song   = song;
    _doc    = doc;

    var blocksHtml = (doc.blocks || []).map(function (blk, bi) {
      return _renderBlock(blk, bi);
    }).join('');

    var arrHtml = (doc.arrangement || []).map(function (bid) {
      var blk = (doc.blocks || []).find(function (b) { return b.id === bid; });
      if (!blk) return '';
      var c = _blockTypeColor(blk.type);
      return '<div class="arr-chip" style="border-color:' + c.col + ';color:' + c.col + ';background:' + c.bg + '">' +
        _arrLabel(blk) + '</div>';
    }).join('');

    document.getElementById('root').innerHTML =
      '<div class="song-nav-bar">' +
        '<div class="nav-back" onclick="APP.goBack()"><svg width="18" height="18"><use href="#ico-back"/></svg></div>' +
        '<div class="top-action-grp">' +
          '<div class="top-act-btn" id="undoBtn" onclick="APP.undo()" style="opacity:.35;pointer-events:none" title="ביטול">' +
            '<svg width="14" height="14"><use href="#ico-undo"/></svg>' +
          '</div>' +
        '</div>' +
        '<div class="song-hdr-info">' +
          '<input id="songTitleInput" class="song-title-input" type="text" dir="auto" autocomplete="off"' +
            ' value="' + _esc(song.Title) + '"' +
            ' oninput="APP.updateTitle(this.value)"' +
            ' placeholder="שם השיר">' +
          '<div class="song-hdr-key" onclick="APP.openSongSettings(null)" style="cursor:pointer" title="הגדרות שיר">' +
            _esc(song.Key || '') + (song.TimeSig ? ' · ' + song.TimeSig : '') +
          '</div>' +
        '</div>' +
        '<div class="hdr-icon-btn" id="lyrBtn" onclick="APP.toggleLyrics()" title="תצוגת מילים">' +
          '<svg width="15" height="15"><use href="#ico-eye"/></svg>' +
        '</div>' +
        '<div class="hdr-icon-btn" id="copyBtn" onclick="APP.toggleCopy()" title="העתק">' +
          '<svg width="14" height="14"><use href="#ico-copy"/></svg>' +
        '</div>' +
        '<div class="hdr-icon-btn" id="memoBtn" onclick="APP.openMemoPanel()" title="הקלטה קולית">' +
          '<svg width="14" height="14"><use href="#ico-mic"/></svg>' +
        '</div>' +
        '<div class="nav-row-break" aria-hidden="true"></div>' +
        '<span class="collapse-all-btn" id="collapseAllBtn" onclick="EDITOR.collapseAll()">קפל הכל</span>' +
      '</div>' +
      '<div class="sync-row"><span class="sync-dot" id="syncDot"></span><span id="syncStatus">שמור</span></div>' +
      '<div id="memoPanel" style="display:none" class="memo-panel">' +
        '<div class="memo-panel-row">' +
          '<button class="memo-rec-btn" id="memoRecBtn" onclick="APP.toggleMemo()">⏺ הקלט</button>' +
          '<div class="memo-player-wrap" id="memoPlayerWrap" style="display:none"></div>' +
        '</div>' +
      '</div>' +
      '<div class="arr-strip">' + arrHtml + '</div>' +
      '<div class="editor-scroll" id="editorScroll">' + blocksHtml + '</div>' +
      '<div class="copy-menu" id="copyMenu" style="display:none">' +
        '<div class="copy-menu-title">העתק כ...</div>' +
        '<div class="copy-opt" onclick="APP.copyAs(\'chords\')">' +
          '<svg width="13" height="13"><use href="#ico-chord"/></svg>' +
          '<div><div class="copy-opt-title">עם אקורדים</div><div class="copy-opt-desc">שורות אקורד מעל מילים</div></div>' +
        '</div>' +
        '<div class="copy-opt" onclick="APP.copyAs(\'lyrics\')">' +
          '<svg width="13" height="13"><use href="#ico-eye"/></svg>' +
          '<div><div class="copy-opt-title">מילים בלבד</div><div class="copy-opt-desc">ללא אקורדים</div></div>' +
        '</div>' +
        '<div class="copy-opt" onclick="APP.copyAs(\'inline\')">' +
          '<svg width="13" height="13"><use href="#ico-struct"/></svg>' +
          '<div><div class="copy-opt-title">אינליין (Am)מילים</div><div class="copy-opt-desc">פורמט ניתן לעיון</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="chord-picker" id="chordPicker" style="display:none">' +
        '<div class="picker-drag-bar"></div>' +
        '<div class="picker-hdr">' +
          '<span class="picker-title" id="pickerTitle">בחר אקורד</span>' +
          '<div class="picker-remove-btn" id="pickerRemoveBtn" onclick="EDITOR.removeChord()" style="display:none">הסר</div>' +
        '</div>' +
        '<input class="picker-search" id="pickerSearch" dir="ltr" type="text" placeholder="חפש: Am, G7, Cmaj7..." oninput="EDITOR.filterChords(this.value)">' +
        '<div class="picker-sugg" id="pickerSugg"></div>' +
        '<div class="picker-common" id="pickerCommon"></div>' +
        '<div class="picker-kbd" id="pickerKbd"></div>' +
      '</div>';

    _setBottomNav('editor');
    _buildChordPicker();
    _initAllChordDragTouch();
    _initBlockDragTouch();
    _initLineDragTouch();

  function _renderBlock(blk, bi) {
    var c = _blockTypeColor(blk.type);
    var occ = _countOccurrences(blk.id);
    var linesHtml = (blk.lines || []).map(function (ln, li) {
      return _renderLine(ln, bi, li);
    }).join('');
    linesHtml += '<div class="add-line-row" onclick="EDITOR.addLine(' + bi + ')">' +
      '<span style="color:var(--t3);font-size:.82rem">+ שורה</span>' +
      '</div>';

    var isCollapsed = !!_collapsedBlocks[blk.id];
    return '<div class="block' + (isCollapsed ? ' collapsed' : '') + '" data-bi="' + bi + '" data-block-id="' + blk.id + '"' +
      ' style="border-left-color:' + c.col + '"' +
      (!_isTouch ? ' draggable="true"' : '') +
      ' ondragstart="EDITOR.blockDragStart(event,' + bi + ')"' +
      ' ondragend="EDITOR.blockDragEnd(event)"' +
      ' ondragover="EDITOR.blockDragOver(event,' + bi + ')"' +
      ' ondragleave="EDITOR.blockDragLeave(event)"' +
      ' ondrop="EDITOR.blockDrop(event,' + bi + ')">' +
      '<div class="block-hdr">' +
        '<span class="block-drag-handle" title="גרור לסידור מחדש">⠿</span>' +
        '<span class="block-pill" style="background:' + c.bg + ';color:' + c.col + ';cursor:pointer" onclick="APP.openBlockTypePicker(' + bi + ')" title="שנה סוג קטע">' +
          _esc(blk.label || _blockTypeLabel(blk.type)) +
        '</span>' +
        '<span class="dup-btn" onclick="EDITOR.duplicateBlock(' + bi + ')" title="שכפל (Ctrl+D)">' +
          '<svg width="11" height="11"><use href="#ico-dup"/></svg>שכפל' +
        '</span>' +
        (occ > 1 ? '<span class="block-occ">' + occ + 'x</span>' : '') +
        '<span class="block-collapse-btn" onclick="EDITOR.toggleBlockCollapse(\'' + blk.id + '\')" title="קפל/פתח">▼</span>' +
      '</div>' +
      '<div class="lines">' + linesHtml + '</div>' +
      '</div>';
  }

  function _splitWords(lyrics) {
    if (!lyrics) return [];
    var chars = Array.from(lyrics), words = [], i = 0;
    while (i < chars.length) {
      while (i < chars.length && (chars[i] === ' ' || chars[i] === '\t')) i++;
      var start = i;
      while (i < chars.length && chars[i] !== ' ' && chars[i] !== '\t') i++;
      if (i > start) words.push({ text: chars.slice(start, i).join(''), at: start });
    }
    return words;
  }

  function _buildWordChips(ln, bi, li) {
    var words = _splitWords(ln.lyrics);
    if (!words.length) {
      return '<div class="word-chips-row" id="wc_' + bi + '_' + li + '" data-bi="' + bi + '" data-li="' + li + '">' +
        '<span class="word-chip word-chip-ph" onclick="EDITOR.tapWord(event,' + bi + ',' + li + ',0)">' +
          '<div class="word-chord-slot"><span class="chord-add-hint">+</span></div>' +
          '<span class="word-lyr">הקלד...</span>' +
        '</span></div>';
    }
    var chipsHtml = words.map(function (w) {
      var ex = (ln.chords || []).find(function (c) { return c.at === w.at; });
      // draggable is on the chord BADGE only — word text never moves
      var chordDrag = ex
        ? ' draggable="true" ondragstart="EDITOR.chordDragStart(event,' + bi + ',' + li + ',' + w.at + ')" ondragend="EDITOR.chordDragEnd(event)"'
        : '';
      var slotHtml = ex
        ? '<span class="chord"' + chordDrag + '>' + _esc(ex.name) + '</span>'
        : '<span class="chord-add-hint">+</span>';
      return '<span class="word-chip' + (ex ? ' has-chord' : '') + '"' +
        ' data-at="' + w.at + '"' +
        ' ondragover="EDITOR.chordDragOver(event)"' +
        ' ondragleave="EDITOR.chordDragLeave(event)"' +
        ' ondrop="EDITOR.chordDrop(event,' + bi + ',' + li + ',' + w.at + ')"' +
        ' onclick="EDITOR.tapWord(event,' + bi + ',' + li + ',' + w.at + ')">' +
        '<div class="word-chord-slot">' + slotHtml + '</div>' +
        '<span class="word-lyr">' + _esc(w.text) + '</span>' +
        '</span>';
    }).join('');
    return '<div class="word-chips-row" id="wc_' + bi + '_' + li + '" data-bi="' + bi + '" data-li="' + li + '">' + chipsHtml + '</div>';
  }

  function _renderLine(ln, bi, li) {
    return '<div class="line-pair" data-bi="' + bi + '" data-li="' + li + '"' +
      (!_isTouch ? ' draggable="true"' : '') +
      ' ondragstart="EDITOR.lineDragStart(event,' + bi + ',' + li + ')"' +
      ' ondragend="EDITOR.lineDragEnd(event)"' +
      ' ondragover="EDITOR.lineDragOver(event,' + bi + ',' + li + ')"' +
      ' ondragleave="EDITOR.lineDragLeave(event)"' +
      ' ondrop="EDITOR.lineDrop(event,' + bi + ',' + li + ')">' +
      '<span class="line-drag-handle" title="גרור שורה">⠿</span>' +
      _buildWordChips(ln, bi, li) +
      '<div class="line-input-wrap">' +
        '<input type="text" class="lyric-input" dir="rtl" autocomplete="off"' +
          ' value="' + _esc(ln.lyrics || '') + '"' +
          ' oninput="EDITOR.updateLyrics(this,' + bi + ',' + li + ')"' +
          ' onkeydown="EDITOR.handleLineKey(event,' + bi + ',' + li + ')"' +
          ' onfocus="EDITOR.closePicker()"' +
          ' placeholder="הקלד מילים...">' +
        '<div class="line-del-btn" onclick="APP.deleteLine(' + bi + ',' + li + ')" title="מחק שורה">✕</div>' +
      '</div>' +
      '</div>';
  }

  function _segsToHtml(segs, bi, li) {
    return segs.map(function (seg) {
      var chordHtml = seg.chord
        ? '<span class="chord" data-at="' + seg.at + '" onclick="EDITOR.pickChord(event,' + bi + ',' + li + ',' + seg.at + ')">' + _esc(seg.chord) + '</span>'
        : '<span class="chord-ph"></span>';
      return '<span class="seg" data-at="' + seg.at + '" onclick="EDITOR.tapLyric(event,' + bi + ',' + li + ',' + seg.at + ')">' +
        chordHtml + '<span class="lyr">' + _esc(seg.lyr) + '</span>' +
        '</span>';
    }).join('');
  }

  function toggleBlockCollapse(blockId) {
    _collapsedBlocks[blockId] = !_collapsedBlocks[blockId];
    var el = document.querySelector('[data-block-id="' + blockId + '"]');
    if (el) el.classList.toggle('collapsed', !!_collapsedBlocks[blockId]);
  }

  function collapseAll() {
    if (!_doc) return;
    var blocks = _doc.blocks || [];
    var anyExpanded = blocks.some(function (b) { return !_collapsedBlocks[b.id]; });
    blocks.forEach(function (b) { _collapsedBlocks[b.id] = anyExpanded; });
    document.querySelectorAll('.block').forEach(function (el) {
      var id = el.dataset.blockId;
      if (id) el.classList.toggle('collapsed', !!_collapsedBlocks[id]);
    });
    var btn = document.getElementById('collapseAllBtn');
    if (btn) btn.textContent = anyExpanded ? 'פתח הכל' : 'קפל הכל';
  }

  function handleLineKey(e, bi, li) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addLine(bi, li);
      setTimeout(function () {
        var row = document.querySelector('[data-bi="' + bi + '"][data-li="' + (li + 1) + '"]');
        var inp = row && row.querySelector('.lyric-input');
        if (inp) inp.focus();
      }, 40);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
      e.preventDefault();
      duplicateBlock(bi);
    }
  }

  function updateLyrics(input, bi, li) {
    _doc.blocks[bi].lines[li].lyrics = input.value;
    var ln = _doc.blocks[bi].lines[li];
    var wcEl = document.getElementById('wc_' + bi + '_' + li);
    if (wcEl) {
      var tmp = document.createElement('div');
      tmp.innerHTML = _buildWordChips(ln, bi, li);
      var newRow = tmp.firstChild;
      wcEl.parentNode.replaceChild(newRow, wcEl);
      _initChordDragTouch(newRow);
    }
    APP.scheduleAutosave();
  }

  function tapWord(e, bi, li, at) {
    if (e) e.stopPropagation();
    _pickerTarget = { bi: bi, li: li, at: at };
    var existing = (_doc.blocks[bi].lines[li].chords || []).find(function (c) { return c.at === at; });
    var titleEl  = document.getElementById('pickerTitle');
    var removeEl = document.getElementById('pickerRemoveBtn');
    if (titleEl)  titleEl.textContent = existing ? (existing.name + ' — שנה') : 'הוסף אקורד';
    if (removeEl) removeEl.style.display = existing ? 'block' : 'none';
    _buildChordPicker();
    _openPicker();
  }

  // ── Chord drag within a line ────────────────────────────────────────────
  function chordDragStart(e, bi, li, at) {
    _chordDragSrc = { bi: bi, li: li, at: at };
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
    // Show only the chord badge as drag ghost (not the whole word-chip)
    var ghost = document.createElement('span');
    ghost.className = 'chord chord-drag-ghost';
    ghost.textContent = e.currentTarget.textContent;
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, ghost.offsetWidth / 2, ghost.offsetHeight / 2);
    setTimeout(function () { ghost.remove(); }, 0);
    e.currentTarget.classList.add('chord-src-dragging');
  }

  function chordDragEnd(e) {
    _chordDragSrc = null;
    document.querySelectorAll('.chord-src-dragging,.chord-drag-over').forEach(function (el) {
      el.classList.remove('chord-src-dragging', 'chord-drag-over');
    });
  }

  function chordDragOver(e) {
    if (!_chordDragSrc) return;
    e.preventDefault();
    e.currentTarget.classList.add('chord-drag-over');
  }

  function chordDragLeave(e) {
    e.currentTarget.classList.remove('chord-drag-over');
  }

  function chordDrop(e, bi, li, at) {
    e.stopPropagation();
    e.currentTarget.classList.remove('chord-drag-over');
    var src = _chordDragSrc;
    _chordDragSrc = null;
    if (!src || (src.bi === bi && src.li === li && src.at === at)) return;
    if (src.bi !== bi || src.li !== li) return;
    _moveChord(src.bi, src.li, src.at, at);
  }

  function _moveChord(bi, li, fromAt, toAt) {
    var ln = _doc.blocks[bi].lines[li];
    var chords = ln.chords || [];
    var srcChord = chords.find(function (c) { return c.at === fromAt; });
    if (!srcChord) return;
    UNDO.push({ song: _song, doc: _docCopy() });
    ln.chords = chords.filter(function (c) { return c.at !== fromAt && c.at !== toAt; });
    ln.chords.push({ at: toAt, name: srcChord.name });
    var wcEl = document.getElementById('wc_' + bi + '_' + li);
    if (wcEl) {
      var tmp = document.createElement('div');
      tmp.innerHTML = _buildWordChips(ln, bi, li);
      var newRow = tmp.firstChild;
      wcEl.parentNode.replaceChild(newRow, wcEl);
      _initChordDragTouch(newRow);
    }
    APP.scheduleAutosave();
  }

  function _initChordDragTouch(rowEl) {
    if (!rowEl) return;
    // Listen on the chord badge only — word text should not drag
    var chordBadges = Array.from(rowEl.querySelectorAll('.word-chip.has-chord .chord'));
    chordBadges.forEach(function (badge) {
      var chip = badge.closest('.word-chip');
      var touchSrc = null, touchClone = null, moved = false;
      badge.addEventListener('touchstart', function (e) {
        moved = false;
        touchSrc = { chip: chip, bi: parseInt(rowEl.dataset.bi, 10), li: parseInt(rowEl.dataset.li, 10), at: parseInt(chip.dataset.at, 10) };
        // Clone only the chord badge as the visual ghost
        touchClone = badge.cloneNode(true);
        touchClone.style.cssText = 'position:fixed;opacity:0;pointer-events:none;z-index:999;transition:none;margin:0;';
        document.body.appendChild(touchClone);
      }, { passive: true });
      badge.addEventListener('touchmove', function (e) {
        if (!touchSrc || !touchClone) return;
        moved = true;
        e.preventDefault();
        var t0 = e.touches[0];
        // Show ghost only after first movement
        touchClone.style.opacity = '.8';
        touchClone.style.left = (t0.clientX - touchClone.offsetWidth / 2) + 'px';
        touchClone.style.top  = (t0.clientY - touchClone.offsetHeight - 8) + 'px';
        touchClone.style.display = 'none';
        var el = document.elementFromPoint(t0.clientX, t0.clientY);
        touchClone.style.display = '';
        var target = el && el.closest('.word-chip');
        Array.from(rowEl.querySelectorAll('.word-chip')).forEach(function (c) { c.classList.remove('chord-drag-over'); });
        if (target && target !== chip) target.classList.add('chord-drag-over');
      }, { passive: false });
      badge.addEventListener('touchend', function (e) {
        if (!touchSrc) return;
        if (touchClone) { touchClone.remove(); touchClone = null; }
        badge.classList.remove('chord-src-dragging');
        Array.from(rowEl.querySelectorAll('.word-chip')).forEach(function (c) { c.classList.remove('chord-drag-over'); });
        if (moved) {
          var t0 = e.changedTouches[0];
          var el = document.elementFromPoint(t0.clientX, t0.clientY);
          var target = el && el.closest('.word-chip');
          if (target && target !== chip) {
            var toAt = parseInt(target.dataset.at, 10);
            if (!isNaN(toAt)) _moveChord(touchSrc.bi, touchSrc.li, touchSrc.at, toAt);
          }
        }
        touchSrc = null; moved = false;
      });
    });
  }

  function _initAllChordDragTouch() {
    Array.from(document.querySelectorAll('.word-chips-row')).forEach(function (row) {
      _initChordDragTouch(row);
    });
  }

  // ── Line drag touch support ───────────────────────────────────────────
  function _initLineDragTouch() {
    Array.from(document.querySelectorAll('.line-pair')).forEach(function (linePair) {
      var bi = parseInt(linePair.dataset.bi, 10);
      var li = parseInt(linePair.dataset.li, 10);
      var handle = linePair.querySelector('.line-drag-handle');
      if (!handle) return;
      var touchSrc = null, touchClone = null;

      handle.addEventListener('touchstart', function (e) {
        touchSrc = { bi: bi, li: li, pair: linePair };
        touchClone = document.createElement('div');
        touchClone.style.cssText = 'position:fixed;opacity:.7;pointer-events:none;z-index:999;padding:3px 8px;border-radius:4px;background:var(--surf);border:1px solid var(--em);color:var(--em);font-size:.75rem;';
        touchClone.textContent = '⠿';
        document.body.appendChild(touchClone);
        linePair.classList.add('line-dragging');
        var t0 = e.touches[0];
        touchClone.style.left = t0.clientX + 10 + 'px';
        touchClone.style.top  = (t0.clientY - 20) + 'px';
      }, { passive: true });

      handle.addEventListener('touchmove', function (e) {
        if (!touchSrc) return;
        e.preventDefault();
        var t0 = e.touches[0];
        if (touchClone) { touchClone.style.left = t0.clientX + 10 + 'px'; touchClone.style.top = (t0.clientY - 20) + 'px'; }
        if (touchClone) touchClone.style.display = 'none';
        var el = document.elementFromPoint(t0.clientX, t0.clientY);
        if (touchClone) touchClone.style.display = '';
        var targetPair = el && el.closest('.line-pair');
        document.querySelectorAll('.line-drag-over').forEach(function (p) { p.classList.remove('line-drag-over'); });
        if (targetPair && targetPair !== linePair) {
          var tBi = parseInt(targetPair.dataset.bi, 10);
          if (tBi === bi) targetPair.classList.add('line-drag-over');
        }
      }, { passive: false });

      handle.addEventListener('touchend', function (e) {
        if (touchClone) { touchClone.remove(); touchClone = null; }
        linePair.classList.remove('line-dragging');
        document.querySelectorAll('.line-drag-over').forEach(function (p) { p.classList.remove('line-drag-over'); });
        if (!touchSrc) return;
        var src = touchSrc; touchSrc = null;
        var t0 = e.changedTouches[0];
        var el = document.elementFromPoint(t0.clientX, t0.clientY);
        var targetPair = el && el.closest('.line-pair');
        if (targetPair && targetPair !== linePair) {
          var tBi = parseInt(targetPair.dataset.bi, 10);
          var tLi = parseInt(targetPair.dataset.li, 10);
          if (tBi === src.bi && tLi !== src.li) _moveLine(src.bi, src.li, tBi, tLi);
        }
      });
    });
  }

  // ── Block reorder drag ─────────────────────────────────────────────────
  function blockDragStart(e, bi) {
    // Only start drag when the handle was grabbed
    if (!e.target.closest('.block-drag-handle')) { e.preventDefault(); return; }
    _blockDragSrc = bi;
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('block-dragging');
  }

  function blockDragEnd(e) {
    _blockDragSrc = null;
    document.querySelectorAll('.block-dragging,.block-drag-over').forEach(function (el) {
      el.classList.remove('block-dragging', 'block-drag-over');
    });
  }

  function blockDragOver(e, bi) {
    if (_blockDragSrc === null || _blockDragSrc === bi) return;
    e.preventDefault();
    e.currentTarget.classList.add('block-drag-over');
  }

  function blockDragLeave(e) {
    e.currentTarget.classList.remove('block-drag-over');
  }

  function blockDrop(e, bi) {
    e.stopPropagation();
    e.currentTarget.classList.remove('block-drag-over');
    var src = _blockDragSrc;
    _blockDragSrc = null;
    if (src === null || src === bi) return;
    _moveBlock(src, bi);
  }

  function _moveBlock(fromBi, toBi) {
    UNDO.push({ song: _song, doc: _docCopy() });
    var blocks = _doc.blocks;
    var moved = blocks.splice(fromBi, 1)[0];
    blocks.splice(toBi, 0, moved);
    renderEditor(_song, _doc);
    APP.scheduleAutosave();
  }

  function _initBlockDragTouch() {
    Array.from(document.querySelectorAll('.block')).forEach(function (blockEl) {
      var bi = parseInt(blockEl.dataset.bi, 10);
      var handle = blockEl.querySelector('.block-drag-handle');
      if (!handle) return;
      var pressTimer = null, touchClone = null, activeBi = null;

      handle.addEventListener('touchstart', function (e) {
        pressTimer = setTimeout(function () {
          activeBi = bi;
          blockEl.classList.add('block-dragging');
          touchClone = document.createElement('div');
          touchClone.className = 'block-drag-ghost';
          var label = blockEl.querySelector('.block-pill');
          touchClone.textContent = label ? label.textContent : '⠿';
          touchClone.style.cssText = 'position:fixed;opacity:.85;pointer-events:none;z-index:999;padding:4px 10px;border-radius:6px;background:var(--surf);border:1px solid var(--em);color:var(--em);font-size:.8rem;';
          document.body.appendChild(touchClone);
          var t0 = e.touches[0];
          touchClone.style.left = t0.clientX + 12 + 'px';
          touchClone.style.top  = (t0.clientY - 20) + 'px';
        }, 400);
      }, { passive: true });

      handle.addEventListener('touchmove', function (e) {
        clearTimeout(pressTimer); pressTimer = null;
        if (activeBi === null) return;
        e.preventDefault();
        var t0 = e.touches[0];
        if (touchClone) { touchClone.style.left = t0.clientX + 12 + 'px'; touchClone.style.top = (t0.clientY - 20) + 'px'; }
        touchClone && (touchClone.style.display = 'none');
        var el = document.elementFromPoint(t0.clientX, t0.clientY);
        touchClone && (touchClone.style.display = '');
        var targetBlock = el && el.closest('.block');
        document.querySelectorAll('.block-drag-over').forEach(function (b) { b.classList.remove('block-drag-over'); });
        if (targetBlock && targetBlock !== blockEl) targetBlock.classList.add('block-drag-over');
      }, { passive: false });

      handle.addEventListener('touchend', function (e) {
        clearTimeout(pressTimer); pressTimer = null;
        if (touchClone) { touchClone.remove(); touchClone = null; }
        document.querySelectorAll('.block-dragging,.block-drag-over').forEach(function (b) {
          b.classList.remove('block-dragging', 'block-drag-over');
        });
        if (activeBi === null) { activeBi = null; return; }
        var t0 = e.changedTouches[0];
        var el = document.elementFromPoint(t0.clientX, t0.clientY);
        var targetBlock = el && el.closest('.block');
        if (targetBlock && targetBlock !== blockEl) {
          var targetBi = parseInt(targetBlock.dataset.bi, 10);
          if (!isNaN(targetBi)) _moveBlock(activeBi, targetBi);
        }
        activeBi = null;
      });
    });
  }

  // ── Line drag between positions within a block ─────────────────────────
  function lineDragStart(e, bi, li) {
    if (!e.target.closest('.line-drag-handle')) { e.preventDefault(); return; }
    _lineDragSrc = { bi: bi, li: li };
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
    e.currentTarget.classList.add('line-dragging');
  }

  function lineDragEnd(e) {
    _lineDragSrc = null;
    document.querySelectorAll('.line-dragging,.line-drag-over').forEach(function (el) {
      el.classList.remove('line-dragging', 'line-drag-over');
    });
  }

  function lineDragOver(e, bi, li) {
    if (!_lineDragSrc) return;
    if (_lineDragSrc.bi !== bi) return;
    if (_lineDragSrc.li === li) return;
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.classList.add('line-drag-over');
  }

  function lineDragLeave(e) {
    e.currentTarget.classList.remove('line-drag-over');
  }

  function lineDrop(e, bi, li) {
    e.stopPropagation();
    e.currentTarget.classList.remove('line-drag-over');
    var src = _lineDragSrc;
    _lineDragSrc = null;
    if (!src || src.bi !== bi || src.li === li) return;
    _moveLine(src.bi, src.li, bi, li);
  }

  function _moveLine(fromBi, fromLi, toBi, toLi) {
    UNDO.push({ song: _song, doc: _docCopy() });
    if (fromBi === toBi) {
      var lines = _doc.blocks[fromBi].lines;
      var moved = lines.splice(fromLi, 1)[0];
      lines.splice(toLi > fromLi ? toLi - 1 : toLi, 0, moved);
    } else {
      var movedLine = _doc.blocks[fromBi].lines.splice(fromLi, 1)[0];
      _doc.blocks[toBi].lines.splice(toLi, 0, movedLine);
      if (!_doc.blocks[fromBi].lines.length) {
        _doc.blocks[fromBi].lines.push({ lyrics: '', chords: [] });
      }
    }
    renderEditor(_song, _doc);
    APP.scheduleAutosave();
  }
